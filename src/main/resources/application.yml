spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  aplication:
    name: "project.artifactId@"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    web:
      pageable:
        max-page-size: 2147483647
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB