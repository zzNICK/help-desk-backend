SPI.INVALIDAR_CODIGOS_ANTERIORES=\
  UPDATE user_recuperacao_senha SET in_utilizado = true \
  WHERE id_user = :idUsuario \
  AND nm_tipo_codigo = :nmTipoCodigo \
  AND in_utilizado = FALSE

SPI.SALVAR_CODIGO_VERIFICACAO=\
  INSERT INTO user_recuperacao_senha \
    (id_user, \
    cd_verificacao, \
    nm_tipo_codigo, \
    dt_expiracao, \
    in_utilizado, \
    dt_inclusao) \
  VALUES ( \
    :idUsuario, \
    :cdVerificacao, \
    :nmTipoCodigo, \
    :dtExpiracao, \
    false, \
    NOW())

SPS.BUSCAR_ID_USUARIO_POR_EMAIL=\
  SELECT id_user \
  FROM users \
  WHERE nm_email = :nmEmail \
  AND in_ativo = true

SPS.VERIFICAR_CODIGO_VALIDO=\
  SELECT id_user_recuperacao_senha \
  FROM user_recuperacao_senha \
  WHERE id_user = :idUsuario \
  AND cd_verificacao = :cdVerificacao AND nm_tipo_codigo = :nmTipoCodigo \
  AND in_utilizado = false AND dt_expiracao > NOW()

SPI.MARCAR_CODIGO_UTILIZADO=\
  UPDATE user_recuperacao_senha SET in_utilizado = true, \
  dt_utilizacao = NOW() \
  WHERE id_user_recuperacao_senha = :idUserRecuperacaoSenha

SPI.ATUALIZAR_SENHA_USUARIO=\
  UPDATE users SET ps_hash = :nmNovaSenhaHash, \
  dt_alteracao = NOW() \
  WHERE id_user = :idUsuario

SPI.ATUALIZAR_EMAIL_USUARIO=\
  UPDATE users SET nm_email = :nmNovoEmail, \
  dt_alteracao = NOW() WHERE id_user = :idUsuario