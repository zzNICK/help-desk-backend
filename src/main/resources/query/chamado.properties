SPI.SALVAR_CHAMADO=\
  INSERT INTO chamado \
    (id_user, \
    ds_descricao, \
    nm_status, \
    dt_inclusao) \
  VALUES ( \
    :idUser, \
    :dsDescricao, \
    :nmStatus, \
    :dtInclusao) \
  RETURNING id_chamado

SPS.BUSCAR_CHAMADO_POR_ID=\
  SELECT \
    c.id_chamado AS id, \
    c.id_user AS idUser, \
    u.nm_user AS nmUser, \
    c.ds_descricao AS dsDescricao, \
    c.nm_status AS nmStatus, \
    c.dt_inclusao AS dtInclusao, \
    c.dt_alteracao AS dtAlteracao \
  FROM chamado c \
  INNER JOIN users u ON c.id_user = u.id_user \
  WHERE c.id_chamado = :idChamado

SPS.BUSCAR_CHAMADOS=\
  SELECT \
    c.id_chamado AS id, \
    c.id_user AS idUser, \
    u.nm_user AS nmUser, \
    c.ds_descricao AS dsDescricao, \
    c.nm_status AS nmStatus, \
    c.dt_inclusao AS dtInclusao, \
    c.dt_alteracao AS dtAlteracao \
  FROM chamado c \
  INNER JOIN users u ON c.id_user = u.id_user \
  ORDER BY c.dt_inclusao DESC

SPS.BUSCAR_CHAMADOS_POR_USUARIO=\
  SELECT \
    c.id_chamado AS id, \
    c.id_user AS idUser, \
    u.nm_user AS nmUser, \
    c.ds_descricao AS dsDescricao, \
    c.nm_status AS nmStatus, \
    c.dt_inclusao AS dtInclusao, \
    c.dt_alteracao AS dtAlteracao \
  FROM chamado c \
  INNER JOIN users u ON c.id_user = u.id_user \
  WHERE c.id_user = :idUser \
  ORDER BY c.dt_inclusao DESC

SPI.ALTERAR_STATUS_CHAMADO=\
  UPDATE chamado \
  SET nm_status = :nmStatus, \
      dt_alteracao = :dtAlteracao \
  WHERE id_chamado = :id