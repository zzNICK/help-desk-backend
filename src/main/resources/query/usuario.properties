SPI.SALVAR_USUARIO=\
  INSERT INTO users \
    (id_role, \
    nm_user, \
    ps_hash, \
    nm_email, \
    in_ativo, \
    dt_inclusao) \
  VALUES ( \
    :idRole, \
    :nmUser, \
    :psHash, \
    :nmEmail, \
    :inAtivo, \
    :dtInclusao) \
  RETURNING id_user

SPS.BUSCAR_USUARIO_POR_EMAIL=\
  SELECT \
    u.id_user AS id, \
    u.id_role AS idRole, \
    u.nm_user AS nmUser, \
    u.ps_hash AS psHash, \
    u.nm_email AS nmEmail, \
    u.in_ativo AS inAtivo, \
    u.dt_inclusao AS dtInclusao, \
    u.dt_alteracao AS dtAlteracao \
  FROM users u \
  WHERE u.nm_email = :nmEmail

SPS.BUSCAR_ID_ROLE_POR_NOME=\
  SELECT id_role \
  FROM role \
  WHERE nm_role = :nmRole